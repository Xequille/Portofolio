<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1a1a1a"/>
            <stop offset="1" stop-color="#050505"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.76" cy="0.34" r="0.55">
            <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <!-- glass dark base -->
    <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.16)"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#glow)"/>
    <!-- tilted square motif (rbx-mark) -->
    <rect x="19" y="19" width="26" height="26" rx="4.5" fill="none" stroke="#ffffff" stroke-width="3.2" transform="rotate(18 32 32)"/>
    <!-- emerald status dot -->
    <circle cx="48" cy="22.5" r="8" fill="#34d399" opacity="0.22"/>
    <circle cx="48" cy="22.5" r="4.2" fill="#34d399" stroke="#050505" stroke-width="1.4"/>
</svg>
